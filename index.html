<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Guard against libraries attempting to reassign window.fetch when window has only a getter
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              var pFetch = window.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return pFetch; },
                set: function(val) { pFetch = val; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch of #<Window>') !== -1) {
            event.preventDefault && event.preventDefault();
            return true;
          }
        });

        // Inicializador instantâneo do tema (Modo Escuro como padrão)
        try {
          var savedTheme = localStorage.getItem('sn_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', savedTheme);
          if (savedTheme === 'light') {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (eTheme) {}
      })();
    </script>
